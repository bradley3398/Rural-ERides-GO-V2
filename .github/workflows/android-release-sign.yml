name: Android Signed Release (Google Play)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Public GitHub Release tag (e.g. v47.0)'
        type: string
        default: 'v47.0'
      publish_github_release:
        description: 'Publish public GitHub Release with signed APK & AAB'
        type: boolean
        default: true
      deploy_to_play:
        description: 'Upload signed App Bundle (.aab) to Google Play Console (optional)'
        type: boolean
        default: false
      play_track:
        description: 'Google Play release track'
        type: choice
        default: production
        options:
          - production
          - beta
          - alpha
          - internal
      release_status:
        description: 'Google Play release status'
        type: choice
        default: completed
        options:
          - completed
          - draft
          - halted
          - inProgress

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-sign-release:
    name: Build, Sign & Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve signing mode & validate secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          IS_TAG_PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
          MANUAL_PLAY_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_to_play == true }}
        run: |
          present=0
          missing=0
          for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -n "${!var}" ]; then
              present=$((present + 1))
            else
              missing=$((missing + 1))
            fi
          done

          if [ "$present" -eq 4 ]; then
            signing_mode="custom"
          elif [ "$present" -gt 0 ]; then
            for var in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
              if [ -z "${!var}" ]; then
                echo "::error::Incomplete custom signing configuration. Missing secret: $var"
              fi
            done
            exit 1
          else
            signing_mode="fallback"
            echo "::notice::No custom keystore secrets configured; using repository keystore (debug.keystore.base64) for GitHub Release APK."
          fi

          should_deploy_play="false"
          if [ "$MANUAL_PLAY_DEPLOY" = "true" ]; then
            if [ "$signing_mode" != "custom" ]; then
              echo "::error::Google Play upload requires KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets."
              exit 1
            fi
            if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
              echo "::error::Missing required GitHub Actions secret: PLAY_SERVICE_ACCOUNT_JSON because deploy_to_play was enabled."
              exit 1
            fi
            should_deploy_play="true"
          elif [ "$IS_TAG_PUSH" = "true" ] && [ "$signing_mode" = "custom" ] && [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            should_deploy_play="true"
          fi

          echo "signing_mode=$signing_mode" >> "$GITHUB_OUTPUT"
          echo "should_deploy_play=$should_deploy_play" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK (API 36)
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare signing keystore
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.signing_mode }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          # Materialize repository keystore (matches Firebase SHA-1 in app/google-services.json)
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 --decode > debug.keystore
          fi

          if [ "$SIGNING_MODE" = "custom" ]; then
            KEYSTORE_PATH="${RUNNER_TEMP}/release-upload.jks"
            printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            echo "RELEASE_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

            keytool -list \
              -keystore "$KEYSTORE_PATH" \
              -storepass:env KEYSTORE_PASSWORD \
              -alias "$KEY_ALIAS" > /dev/null

            INIT_SCRIPT="${RUNNER_TEMP}/release-signing.init.gradle"
            cat << 'EOF' > "$INIT_SCRIPT"
          allprojects {
              plugins.withId("com.android.application") {
                  def androidComponents = extensions.findByName("androidComponents")
                  if (androidComponents != null) {
                      androidComponents.finalizeDsl { ext ->
                          def keystorePath = System.getenv("RELEASE_KEYSTORE_PATH")
                          def storePass = System.getenv("KEYSTORE_PASSWORD")
                          def alias = System.getenv("KEY_ALIAS")
                          def keyPass = System.getenv("KEY_PASSWORD")

                          if (keystorePath == null || keystorePath.isEmpty()) {
                              throw new GradleException("RELEASE_KEYSTORE_PATH environment variable is missing.")
                          }

                          def releaseSigning = ext.signingConfigs.findByName("release")
                          if (releaseSigning == null) {
                              releaseSigning = ext.signingConfigs.create("release")
                          }
                          releaseSigning.storeFile = new File(keystorePath)
                          releaseSigning.storePassword = storePass
                          releaseSigning.keyAlias = alias
                          releaseSigning.keyPassword = keyPass

                          ext.buildTypes.getByName("release").signingConfig = releaseSigning
                      }
                  }
              }
          }
          EOF
            echo "SIGNING_INIT_SCRIPT=$INIT_SCRIPT" >> "$GITHUB_ENV"
          elif [ ! -f debug.keystore ]; then
            echo "::notice::debug.keystore.base64 not found; generating a fallback signing keystore."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore google-services.json from GitHub Secret (if missing)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON" ]; then
              printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
              echo "Restored app/google-services.json from GOOGLE_SERVICES_JSON secret."
            else
              echo "::error::Missing app/google-services.json. Add it as a GitHub Actions secret named GOOGLE_SERVICES_JSON in Settings -> Secrets and variables -> Actions."
              exit 1
            fi
          fi

      - name: Build signed Release AAB and APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${SIGNING_INIT_SCRIPT:-}" ]; then
            gradle --init-script "$SIGNING_INIT_SCRIPT" \
              :app:bundleRelease \
              :app:assembleRelease \
              --no-daemon \
              --stacktrace
          else
            gradle \
              :app:bundleRelease \
              :app:assembleRelease \
              --no-daemon \
              --stacktrace
          fi

      - name: Verify AAB and APK signatures & generate SHA-256 checksums
        env:
          SIGNING_MODE: ${{ steps.signing.outputs.signing_mode }}
        run: |
          AAB_FILE=$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' | head -n 1)
          APK_FILE=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)

          if [ -z "$AAB_FILE" ] || [ ! -f "$AAB_FILE" ]; then
            echo "::error::Release App Bundle (.aab) was not generated."
            exit 1
          fi

          echo "Verifying App Bundle signature: $AAB_FILE"
          VERIFY_OUTPUT=$(jarsigner -verify -verbose -certs "$AAB_FILE")
          echo "$VERIFY_OUTPUT" | tail -n 20

          if [ "$SIGNING_MODE" = "custom" ] && echo "$VERIFY_OUTPUT" | grep -q "CN=Android Debug"; then
            echo "::error::Bundle is signed with the Android Debug certificate instead of the release upload key."
            exit 1
          fi

          echo "SIGNED_AAB_PATH=$AAB_FILE" >> "$GITHUB_ENV"

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
            if [ -n "$APKSIGNER" ]; then
              echo "Verifying Release APK signature: $APK_FILE"
              "$APKSIGNER" verify --verbose --print-certs "$APK_FILE"
            fi
            echo "SIGNED_APK_PATH=$APK_FILE" >> "$GITHUB_ENV"
          fi

          # Generate SHA-256 verification checksums for rider trust
          {
            [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ] && sha256sum "$APK_FILE"
            sha256sum "$AAB_FILE"
          } > app/build/outputs/SHA256SUMS.txt
          cat app/build/outputs/SHA256SUMS.txt

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rural-erides-go-signed-release-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish public GitHub Release with signed APK, AAB & SHA-256 Checksums
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_github_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'v47.0' }}
          name: Rural Erides GO ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag || 'v47.0' }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/SHA256SUMS.txt

      - name: Deploy signed AAB to Google Play Console (When Enabled)
        if: steps.signing.outputs.should_deploy_play == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.aistudio.volttrail.kqrmvx
          releaseFiles: ${{ env.SIGNED_AAB_PATH }}
          track: ${{ inputs.play_track || 'production' }}
          status: ${{ inputs.release_status || 'completed' }}

      - name: Clean up temporary keystore and signing files
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/release-upload.jks" \
                "${RUNNER_TEMP}/release-signing.init.gradle" \
                debug.keystore
