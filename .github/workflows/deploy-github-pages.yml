name: Deploy Rural Landing Page (GitHub Pages)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & Stage Landing Page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage static landing page files
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r public/. _site/
          rm -rf _site/assets/aistudio
          touch _site/.nojekyll
          test -f _site/index.html
          ls -la _site

      - name: Upload landing page artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: './_site'
          include-hidden-files: true

  deploy:
    name: Publish Rural Erides GO Landing Page
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
